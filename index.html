<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Genesis Evolution – Neon Frenzy</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;background:#060616;overflow:hidden;font-family:"Inter",Arial,sans-serif}
canvas{width:100%;height:100%;display:block;touch-action:none;
       background:radial-gradient(circle at center,#32005a 0%,#000 85%)}
#hud{position:fixed;top:14px;left:18px;color:#fff;font-size:15px;text-shadow:0 0 4px rgba(255,255,255,.3);z-index:2}
#compass{position:fixed;top:60px;left:18px;color:#aaa;font-size:12px;line-height:12px;
         letter-spacing:1px;text-shadow:0 0 2px #000;z-index:2}
#effBar{position:fixed;bottom:14px;left:18px;width:220px;height:18px;border-radius:9px;
        background:rgba(255,255,255,.12);z-index:2}
#effFill{width:100%;height:100%;border-radius:9px;background:#00e4b8}
#pauseBtn{position:fixed;top:14px;right:18px;font-size:22px;color:#fff;cursor:pointer;user-select:none;z-index:2}
#radarWrap{position:fixed;top:48px;right:18px;width:70px;height:70px;display:none;z-index:2}
#radar{width:70px;height:70px;border:1px solid #555;border-radius:4px;background:rgba(0,0,0,.4)}
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="hud">Mass: <span id="mass">10</span>  Score: <span id="score">0</span>  <span id="level">1</span></div>
<div id="compass">N<br>E  W<br> S</div>
<div id="effBar"><div id="effFill"></div></div>
<div id="pauseBtn">⏸︎</div>

<div id="radarWrap"><canvas id="radar" width="70" height="70"></canvas></div>

<audio id="bgm" src="background-music.mp3" loop preload="auto"></audio>

<script>
/* ========== CONSTANTS & UTILS ========== */
const CFG={WORLD_SIZE:3200,FOOD_MAX:60,MASS_THRESH:600,RING_DIST:1600,FRENZY_TIME:1e4,
  FRENZY_BONUS_SCALE:.4,CAMERA_MIN_ZOOM:.45,COLORS:["#00e4b8","#0ff","#00faff","#22e"],
  PILL_COLORS:["#00aaff","#ff39ff"]};
const rand=n=>Math.random()*n-n/2;
const dist=(ax,ay,bx,by)=>Math.hypot(ax-bx,ay-by);
const lerp=(a,b,t)=>a+(b-a)*t;
function mixHex(a,b,t){const A=parseInt(a.slice(1),16),B=parseInt(b.slice(1),16);
  const r=lerp(A>>16,B>>16,t)|0,g=lerp(A>>8&255,B>>8&255,t)|0,b2=lerp(A&255,B&255,t)|0;
  return`rgb(${r},${g},${b2})`}

/* ========== CANVAS & HUD ========== */
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
const radarC=document.getElementById('radar'),rctx=radarC.getContext('2d');
const $m=document.getElementById('mass'),$s=document.getElementById('score'),$l=document.getElementById('level');
const pauseBtn=document.getElementById('pauseBtn'),radarWrap=document.getElementById('radarWrap');
let W=innerWidth,H=innerHeight;const resize=()=>{W=canvas.width=innerWidth;H=canvas.height=innerHeight};addEventListener('resize',resize);resize();

/* ========== SIMPLE POOL ========== */
const Pool=make=>{const a=[];return()=>a.pop()||make()};

/* ========== ENTITIES ========== */
class Ent{constructor(r=6){this.x=0;this.y=0;this.r=r}}
class Player extends Ent{constructor(){super(15);this.mass=10;this.tail=[];this.boost=0}
  rad(){return 10+Math.sqrt(this.mass)*1.6}}
class Food extends Ent{constructor(){super();this.frenzy=false;this.cx=this.cy=0;this.ang=this.baseR=this.angV=0}
  step(dt){if(this.frenzy){this.ang+=this.angV*dt;this.x=this.cx+Math.cos(this.ang)*this.baseR;
                            this.y=this.cy+Math.sin(this.ang)*this.baseR}}}

const foodPool=Pool(()=>new Food());
const foePool=Pool(()=>new Ent());

/* ========== WORLD ARRAYS ========== */
const player=new Player();
const food=[],foes=[],titans=[],spectres=[],reapers=[],beacons=[];
for(let i=0;i<CFG.FOOD_MAX;i++)spawnFood();
['N','S','E','W'].forEach(d=>{const p={N:[0,-CFG.RING_DIST],S:[0,CFG.RING_DIST],E:[CFG.RING_DIST,0],W:[-CFG.RING_DIST,0]}[d];
  beacons.push({x:p[0],y:p[1],r:18})});

/* ========== CAMERA ========== */
const cam={zoom:1,tx:0,ty:0};
function toWorld(px,py){return{x:(px-cam.tx)/cam.zoom,y:(py-cam.ty)/cam.zoom}}

/* ========== INPUT ========== */
let target={x:0,y:0,active:false};
canvas.addEventListener('pointerdown',e=>{if(!paused){const w=toWorld(e.clientX,e.clientY);target=w;target.active=true}});
canvas.addEventListener('pointermove',e=>{if(target.active&&!paused){const w=toWorld(e.clientX,e.clientY);target=w}});
addEventListener('pointerup',()=>target.active=false);

/* ========== MUSIC & PAUSE ========== */
let paused=false;const bgm=document.getElementById('bgm');
pauseBtn.onclick=()=>{paused=!paused;pauseBtn.textContent=paused?'▶︎':'⏸︎';paused?bgm.pause():bgm.play().catch(()=>{})};
addEventListener('pointerdown',()=>{if(!paused)bgm.play().catch(()=>{})},{once:true});

/* ========== GAMEPLAY STATE VARS ========== */
let last=0,level=1,flash=0,frenzy=false,F_TIME=0,fLeft=0,bonusFlash=0;
let titanKills=0,spectreKills=0,reaperGrace=6000,radarActive=false;
const pill={active:false,x:0,y:0,r:10,cd:0};

/* ========== SPAWNERS ========== */
function spawnFood(){const f=foodPool();f.x=rand(1800);f.y=rand(1800);f.r=6;f.frenzy=false;food.push(f)}
function spawnFoe(){const e=foePool();e.x=rand(2000);e.y=rand(2000);
  e.r=(player.mass>=CFG.MASS_THRESH?14:10)+Math.random()*20;foes.push(e)}
function arcSpawn(arr,min,span,r){const e=foePool();const a=Math.random()*6.283,d=min+Math.random()*span;
  e.x=player.x+Math.cos(a)*d;e.y=player.y+Math.sin(a)*d;e.r=r();arr.push(e);return e}
const spawnTitan=()=>arcSpawn(titans,700,500,()=>25+Math.random()*35);
const spawnSpectre=()=>arcSpawn(spectres,600,400,()=>22+Math.random()*25);
const spawnReaper=()=>arcSpawn(reapers,800,600,()=>38+Math.random()*28);

/* ========== MAIN LOOP ========== */
requestAnimationFrame(loop);
function loop(ts){
  const dt=(ts-last)||16;last=ts;if(paused){requestAnimationFrame(loop);return}

  /* camera first (so input this frame uses up-to-date tx/ty) */
  cam.zoom=Math.max(CFG.CAMERA_MIN_ZOOM,Math.min(1,300/player.rad()));
  cam.tx=W/2-player.x*cam.zoom;cam.ty=H/2-player.y*cam.zoom;
  ctx.setTransform(cam.zoom,0,0,cam.zoom,cam.tx,cam.ty);

  movePlayer(dt);updateFood(dt);spawns(dt);collisions(dt);render(ts);
  hud();requestAnimationFrame(loop)
}

/* ========== SUBSYSTEMS ========== */
function movePlayer(dt){
  const dx=(target.active?target.x:player.x)-player.x,
        dy=(target.active?target.y:player.y)-player.y,
        len=Math.hypot(dx,dy)||1;
  if(player.boost>0)player.boost=Math.max(0,player.boost-dt);
  const sp=(2.5+0.25*(level-1))*(player.boost?1.25:1)*(frenzy?1.3:1);
  player.x+=dx/len*sp;player.y+=dy/len*sp;
  player.r=player.rad();player.tail.unshift({x:player.x,y:player.y});
  if(player.tail.length>player.mass/3)player.tail.pop();
  player.mass=Math.max(5,player.mass-((.000009*player.r*player.r)+(player.mass<150?.002:.003))*dt)
}
function updateFood(dt){for(const f of food)f.step(dt);while(food.length<CFG.FOOD_MAX)spawnFood()}
function spawns(dt){
  while(foes.length<(player.mass>=CFG.MASS_THRESH?18:12))spawnFoe();
  if(level>=10)while(titans.length<6)spawnTitan();
  if(titanKills>=10)while(spectres.length<3)spawnSpectre();
  if(reaperGrace>0)reaperGrace-=dt
}
function collisions(dt){
  handle(food,(f,i)=>{player.mass+=f.r*(f.frenzy?.6:1.2);
    if(f.frenzy&&!--fLeft){const secs=Math.max(1,Math.ceil(F_TIME/1000));
      player.mass+=Math.min(400,40*Math.sqrt(level))*secs*CFG.FRENZY_BONUS_SCALE;bonusFlash=60}
    food.splice(i,1)});
  handle(foes,(e,i)=>eatLogic(e,i,2.5,.04));
  handle(titans,(e,i)=>eatLogic(e,i,5,.1,()=>titanKills++));
  handle(spectres,(e,i)=>eatLogic(e,i,7,.2,()=>{
    player.boost=6e3;++spectreKills;if(!(spectreKills%6)&&reapers.length<3&&reaperGrace<=0)spawnReaper()}));
  handle(reapers,(e,i)=>eatLogic(e,i,10,.25));
  beacons.forEach((b,i)=>{if(dist(player.x,player.y,b.x,b.y)<player.r+b.r){beacons.length=0;radarActive=true;radarWrap.style.display='block'}})
}
function handle(arr,fn){for(let i=arr.length;i--;)if(dist(player.x,player.y,arr[i].x,arr[i].y)<player.r+arr[i].r)fn(arr[i],i)}
function eatLogic(e,idx,gain,hit,onKill){
  if(player.r>e.r){player.mass+=e.r*gain;thisArr(idx);onKill&&onKill()}
  else player.mass=Math.max(5,player.mass-hit*16)}function thisArr(i){this.splice(i,1)}
function render(t){
  ctx.clearRect(( -cam.tx)/cam.zoom,( -cam.ty)/cam.zoom,W/cam.zoom,H/cam.zoom);drawGrid();
  food.forEach(f=>glow(f.x,f.y,f.r,f.frenzy?f.col:'#ff0',f.frenzy?.8:.65));
  if(pill.active){const ph=(Math.sin(t*.005)+1)/2;glow(pill.x,pill.y,pill.r,mixHex(...CFG.PILL_COLORS,ph),.95)}
  foes.forEach(e=>glow(e.x,e.y,e.r,'#f00',.8));
  titans.forEach(e=>glow(e.x,e.y,e.r,'#cc00ff',.9));
  spectres.forEach(s=>{const ph=(Math.sin((t+s.x)*.006)+1)/2;glow(s.x,s.y,s.r,mixHex('#ffde59','#ff39ff',ph),.9)});
  reapers.forEach(r=>{const ph=(Math.sin((t+r.y)*.004)+1)/2;glow(r.x,r.y,r.r,mixHex('#ff8800','#ff39ff',ph),.9)});
  beacons.forEach(b=>{const ph=(Math.sin(t*.004)+1)/2;glyph(b.x,b.y,b.r*1.1,mixHex('#00e4ff','#ff39ff',ph))});
  player.tail.forEach((p,i)=>glow(p.x,p.y,player.r*(1-i/player.tail.length),mixHex('#00e4b8','#ff39ff',i/player.tail.length),.3));
  glow(player.x,player.y,player.r,'#00e4b8',1);
  if(radarActive){rctx.clearRect(0,0,70,70);rctx.strokeStyle='#666';rctx.beginPath();
    rctx.moveTo(35,0);rctx.lineTo(35,70);rctx.moveTo(0,35);rctx.lineTo(70,35);rctx.stroke();
    const m=Math.max(CFG.RING_DIST,Math.abs(player.x),Math.abs(player.y))||1,sc=(30-4)/m;
    rctx.fillStyle='#00e4b8';rctx.beginPath();rctx.arc(35+player.x*sc,35+player.y*sc,3,0,6.283);rctx.fill()}
}
function hud(){
  $m.textContent=player.mass.toFixed(0);$s.textContent=Math.floor(player.mass*10);
  if(frenzy){$l.textContent=`FRENZY ${Math.ceil(F_TIME/1000)}`;$l.style.color=bonusFlash&&bonusFlash--%2?'#ff0':'#ff39ff'}
  else{$l.textContent=level;$l.style.color=flash&&flash--%2?'#ff0':'#fff'}
}
function glow(x,y,r,c,a){ctx.save();ctx.globalAlpha=a;ctx.shadowBlur=12;ctx.shadowColor=c;ctx.fillStyle=c;
  ctx.beginPath();ctx.arc(x,y,r,0,6.283);ctx.fill();ctx.restore()}
function glyph(x,y,r,c){ctx.save();ctx.shadowBlur=12;ctx.shadowColor=c;ctx.fillStyle=c;
  ctx.font=`${r*2}px Inter`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('R',x,y);ctx.restore()}
function drawGrid(){ctx.lineWidth=1.2;const step=120,d=6;
  for(let z=0;z<d;z++){const s=1+z*.15,o=.8-.12*z;ctx.strokeStyle=`rgba(34,34,34,${o})`;
    for(let i=-4;i<=4;i++)for(let j=-4;j<=4;j++){const x=i*step*s,y=j*step*s,l=step*s;
      ctx.strokeRect(x,y,l,l);
      ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x-l*.4,y-l*.4);ctx.lineTo(x-l*.4+l,y-l*.4);ctx.lineTo(x+l,y);ctx.stroke();
      ctx.beginPath();ctx.moveTo(x+l,y);ctx.lineTo(x+l+l*.4,y-l*.4);ctx.lineTo(x+l+l*.4-l,y-l*.4+l);ctx.lineTo(x+l,y+l);ctx.stroke()}}}
</script>
</body>
</html>
