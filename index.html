<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Genesis Evolution – Neon Frenzy (stable v3)</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;background:#060616;overflow:hidden;font-family:Inter,Arial,sans-serif}
canvas{width:100%;height:100%;display:block;touch-action:none;background:radial-gradient(circle at center,#32005a 0%,#000 85%)}
#hud{position:fixed;top:14px;left:18px;color:#fff;font-size:15px;text-shadow:0 0 4px rgba(255,255,255,.3);z-index:2}
#pause{position:fixed;top:14px;right:18px;font-size:22px;color:#fff;cursor:pointer;user-select:none;z-index:2}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">M <span id="m">10</span>  S <span id="s">0</span>  L <span id="l">1</span></div>
<div id="pause">⏸︎</div>

<script>
/****************  CONFIG  ****************/
const CFG={
  world      :2000,
  camR       :140,
  minZoom    :0.35,
  foodMax    :60,
  foeMax     :12,
  titan      :{lvl:10,max:6,respawn:20000},
  spectre    :{titanKills:10,max:3},
  reaper     :{lvl:30,time:180000,spawnEvery:15,max:1},
  tailMax    :40
};
const REAPER={dmg:0.05,cd:600,stepBig:45,stepSmall:-35};
/****************  CANVAS  ****************/
const cvs=document.getElementById('c'),ctx=cvs.getContext('2d');
let W,H;const resize=()=>{W=cvs.width=innerWidth;H=cvs.height=innerHeight};resize();addEventListener('resize',resize);
/****************  HUD  ****************/
const mEl=document.getElementById('m'),sEl=document.getElementById('s'),lEl=document.getElementById('l'),pauseBtn=document.getElementById('pause');
/****************  UTIL  ****************/
const rand=v=>Math.random()*v-v/2,dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
/****************  CAMERA  ****************/
const cam={z:1,update(r){this.z=Math.max(CFG.minZoom,Math.min(1,CFG.camR/r))}};
/****************  ENTITY BASE  ****************/
class Ent{
  constructor(x,y,r,c){this.x=x;this.y=y;this.r=r;this.c=c}
  draw(a=1){ctx.globalAlpha=a;ctx.shadowBlur=12;ctx.shadowColor=this.c;ctx.fillStyle=this.c;
    ctx.beginPath();ctx.arc(this.x,this.y,this.r,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;ctx.globalAlpha=1}
}
/****************  GAME STATE  ****************/
const P={x:0,y:0,mass:10,r:15,tail:[],speed:2.5}
let lvl=1,score=0,time=0,paused=false,titanKills=0,spectreKills=0,reaperCounter=0,reapersLive=false;
/****************  ARRAYS  ****************/
const food=[],foes=[],titans=[],spectres=[],reapers=[];
/****************  SPAWNERS  ****************/
const spawnFood=()=>food.push(new Ent(rand(CFG.world),rand(CFG.world),6,"#ff0"));
const spawnFoe =()=>foes.push(new Ent(rand(CFG.world),rand(CFG.world),10+Math.random()*20,"#f00"));
const spawnTitan=()=>{const a=Math.random()*6.28,d=700+Math.random()*500;
  titans.push(new Ent(P.x+Math.cos(a)*d,P.y+Math.sin(a)*d,25+Math.random()*35,"#c3f"))};
const spawnSpectre=()=>{const a=Math.random()*6.28,d=600+Math.random()*400;
  spectres.push(new Ent(P.x+Math.cos(a)*d,P.y+Math.sin(a)*d,22+Math.random()*22,"#ff39ff"))};
const spawnReaper=()=>{const a=Math.random()*6.28,d=950+Math.random()*650;
  reapers.push(new Ent(P.x+Math.cos(a)*d,P.y+Math.sin(a)*d,52,"#39f"))};
/* populate */
for(let i=0;i<CFG.foodMax;i++)spawnFood();
for(let i=0;i<CFG.foeMax;i++)spawnFoe();
/****************  INPUT  ****************/
let tgt={x:0,y:0,act:false};
const toWorld=e=>({x:(e.clientX-W/2)/cam.z+P.x,y:(e.clientY-H/2)/cam.z+P.y});
cvs.onpointerdown=e=>{if(!paused)tgt={...toWorld(e),act:true}};
cvs.onpointermove=e=>{if(tgt.act&&!paused)Object.assign(tgt,toWorld(e))};
addEventListener('pointerup',()=>tgt.act=false);
/****************  LOOP  ****************/
let last=performance.now();
function loop(ts){
  const dt=ts-last;last=ts;if(paused){return requestAnimationFrame(loop)}time+=dt;

  /* unlock reapers */
  if(!reapersLive&&lvl>=CFG.reaper.lvl&&time>=CFG.reaper.time)reapersLive=true;

  /* ---- MOVE & DECAY ---- */
  const dx=(tgt.act?tgt.x:P.x)-P.x,dy=(tgt.act?tgt.y:P.y)-P.y,len=Math.hypot(dx,dy);
  if(len>1){P.x+=dx/len*P.speed;P.y+=dy/len*P.speed}
  const decay=0.000009*P.r*P.r+(P.mass<150?0.002:0.003);
  P.mass=Math.max(5,P.mass-decay*dt*0.0006);
  P.r=10+P.mass/15;score=Math.floor(P.mass*10);
  const newLvl=Math.floor(P.mass/100)+1;if(newLvl>lvl)lvl=newLvl;

  /* ---- SPAWN ENFORCERS ---- */
  while(food.length<CFG.foodMax)spawnFood();
  while(foes.length<CFG.foeMax)spawnFoe();
  if(lvl>=CFG.titan.lvl&&titans.length<CFG.titan.max)spawnTitan();
  if(titanKills>=CFG.spectre.titanKills&&spectres.length<CFG.spectre.max)spawnSpectre();
  if(reapersLive&&reaperCounter>=CFG.reaper.spawnEvery&&reapers.length<CFG.reaper.max){spawnReaper();reaperCounter=0}

  /* ---- UPDATE ARRAYS ---- */
  const up=(arr,fn)=>{for(let i=arr.length-1;i>=0;i--){if(fn(arr[i])===false)arr.splice(i,1)}};
  up(food,f=>{if(dist(f,P)<P.r+f.r){P.mass+=f.r*1.2;return false}});
  up(foes,o=>{
    const d=dist(o,P);if(P.r>o.r&&d<P.r){P.mass+=o.r*2.5;return false}
    if(o.r>P.r&&d<o.r)P.mass-=0.02*dt;
    if(d<250){const dir=o.r<P.r?-1:1;o.x+=(P.x-o.x)/d*dir;o.y+=(P.y-o.y)/d*dir}
  });
  up(titans,t=>{
    const d=dist(t,P);
    if(P.r>t.r&&d<P.r){P.mass+=t.r*5;titanKills++;return false}
    if(t.r>P.r&&d<t.r)P.mass-=0.05*dt;
    t.hop=(t.hop||0)-dt;if(t.hop<=0){t.hop=800;const step=t.r>P.r?110:-70;t.x+=(P.x-t.x)/d*step;t.y+=(P.y-t.y)/d*step}
  });
  up(spectres,s=>{
    const d=dist(s,P);
    if(P.r>s.r&&d<P.r){P.mass+=s.r*7;spectreKills++;reaperCounter++;return false}
    if(s.r>P.r&&d<s.r)P.mass-=0.08*dt;
    s.dash=(s.dash||0)-dt;if(s.dash<=0){s.dash=420;
      const step=s.r>P.r?130:-90;s.x+=(P.x-s.x)/d*step;s.y+=(P.y-s.y)/d*step}
  });
  up(reapers,r=>{
    if(!reapersLive)return false;
    const d=dist(r,P);r.cd=(r.cd||0)-dt;
    if(P.r>r.r&&d<P.r){P.mass+=r.r*10;return false}
    if(r.r>P.r&&d<r.r)P.mass-=REAPER_DMG_RATE*dt;
    if(r.cd<=0){r.cd=REAPER_COOLDOWN;
      const step=r.r>P.r?REAPER_STEP_BIG:REAPER_STEP_SMALL;r.x+=(P.x-r.x)/d*step;r.y+=(P.y-r.y)/d*step}
  });

  /* ---- TAIL ---- */
  P.tail.unshift({x:P.x,y:P.y});if(P.tail.length>CFG.tailMax)P.tail.pop();

  /* ---- CAMERA & CLEAR ---- */
  cam.update(P.r);ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,W,H);
  ctx.setTransform(cam.z,0,0,cam.z,W/2-P.x*cam.z,H/2-P.y*cam.z);

  /* ---- DRAW ---- */
  food.forEach(e=>e.draw());foes.forEach(e=>e.draw());titans.forEach(e=>e.draw());
  spectres.forEach(e=>e.draw());reapers.forEach(e=>e.draw());
  P.tail.forEach((p,i)=>new Ent(p.x,p.y,P.r*(1-i/P.tail.length),"#00e4b8").draw(0.3));
  new Ent(P.x,P.y,P.r,"#00e4b8").draw();

  /* ---- HUD ---- */
  mEl.textContent=P.mass.toFixed(0);sEl.textContent=score;lEl.textContent=lvl;

  requestAnimationFrame(loop)
}
requestAnimationFrame(loop);
/****************  PAUSE  ****************/
pauseBtn.onclick=()=>{paused=!paused;pauseBtn.textContent=paused?"▶︎":"⏸︎"};
</script>
</body>
</html>
